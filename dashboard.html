    <script>
      let category = ["medicine","medical"];
      let num = 0;
      let setCategory = [
        {name: 'biogesics',category_id: 0},
        {name: 'Decolgen',category_id: 0},
        {name: 'Syring',category_id: 1},
        {name: 'Diabetes-meter',category_id: 1},
      ]

      category.map( function (el,index) {
        $("#c").append(`<option value="${index}">${el}</option>`);
      });

      setCategory.map( function (el,index) {
        $("#sc").append(`<option value="${index}" data-category="${el.category_id}">${el.name}</option>`);
      });

      $('#c').on("change", function () {
        let cate = ($(this).val());
        $("#sc option").hide();
        $(`[data-category=${cate}]`).show();
      })
    </script>
